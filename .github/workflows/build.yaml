name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      
permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: svc-courses
  IMAGE_PLATFORMS: linux/arm64,linux/amd64

jobs:

  build-and-push:
    name: Build and Push Docker Image to ACR
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Fetch ACR Login Server from Key Vault
      id: acr
      run: |
        ACR_LOGIN_SERVER=$(az keyvault secret show \
          --vault-name ${{ vars.KEYVAULT_NAME }} \
          --name acr-login-server \
          --query value -o tsv
        )
        echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV

    - name: Login to ACR
      run: |
        az acr login --name ${{ env.ACR_LOGIN_SERVER }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Define Image Tags
      run: |
        TIMESTAMP="$(date -u +"%Y%m%d%H%M%S")"
        TAG_PREFIX="${ACR_LOGIN_SERVER}/${IMAGE_NAME}"
        
        SHA_TAG="${TAG_PREFIX}:$GITHUB_REF_NAME-$GITHUB_SHA"
        TIMESTAMP_TAG="${TAG_PREFIX}:$GITHUB_REF_NAME-${TIMESTAMP}"
        
        IMAGE_TAGS="${SHA_TAG},${TIMESTAMP_TAG}"
        echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_ENV

    - name:  Build and Push Docker Image
      id: build
      uses: docker/build-push-action@v6 
      with:
        context: .
        push: true
        platforms: ${{ env.IMAGE_PLATFORMS }}
        tags: ${{ env.IMAGE_TAGS }}

    - name: Save Image Tag with Digest to a File
      run: |
        DIGEST=${{ steps.build.outputs.digest }}
        TAG_WITH_DIGEST="${ACR_LOGIN_SERVER}/${IMAGE_NAME}@${DIGEST}"
        echo "$TAG_WITH_DIGEST" > image-tag.txt
      
    - name: Upload Image Tag Artifact  
      uses: actions/upload-artifact@v4
      with:
        name: image-tag
        path: image-tag.txt
