name: CI/CD Pipeline
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # TODO: Unit tests

  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  deploy-dev:
    needs: build
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}

  # TODO: Smoke tests on dev deployment

  # TODO: Deploy to prod after manual approval (using environment protection rules)
  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Deploy to Prod
        run: echo "Deploy to production would happen here."
        