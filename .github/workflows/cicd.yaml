name: CI/CD Pipeline
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # TODO: Unit tests

  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}

  # TODO: Smoke tests on dev deployment

  # TODO: Deploy to prod after manual approval (using environment protection rules)
