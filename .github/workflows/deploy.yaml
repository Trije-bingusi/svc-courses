name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]

permissions:
  contents: read
  id-token: write

env:
  K8S_NAMESPACE: rso

jobs:
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Download Image Tag Artifact
      uses: actions/download-artifact@v4
      with:
        name: image-tag

    - name: Read Image Tag from Artifact
      run: |
        IMAGE_TAG=$(cat image-tag.txt)
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Fetch AKS Config from Key Vault
      run: |
        fetch_secret() {
          az keyvault secret show \
            --vault-name ${{ vars.KEYVAULT_NAME }} \
            --name "$1" \
            --query value -o tsv
        }

        echo "RESOURCE_GROUP_NAME=$(fetch_secret rg-name)" >> $GITHUB_ENV
        echo "AKS_CLUSTER_NAME=$(fetch_secret aks-name)" >> $GITHUB_ENV

    - name: Authenticate to AKS
      run: |
        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP_NAME" \
          --name "$AKS_CLUSTER_NAME" \
          --overwrite-existing

    - name: Deploy to AKS using Helm
      run: |
        helm upgrade --install svc-courses ./helm \
          --namespace $K8S_NAMESPACE \
          --values ./helm/values.yaml \
          --values ./helm/environments/values-dev.yaml \
          --set image="$IMAGE_TAG"