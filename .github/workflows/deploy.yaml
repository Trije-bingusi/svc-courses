name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'The image tag to deploy'
        type: string
      k8s_namespace:
        description: 'The Kubernetes namespace to deploy to'
        type: string
      release_name:
        description: 'The Helm release name'
        type: string
      values_file:
        description: 'The Helm values file for the environment'
        type: string
      environment:
        description: 'The deployment environment'
        type: string
        default: 'dev'
      app_version:
        description: 'The application version to set in Helm chart'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

env:
  K8S_NAMESPACE: ${{ inputs.k8s_namespace }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  RELEASE_NAME: ${{ inputs.release_name }}
  VALUES_FILE: ${{ inputs.values_file }}

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Fetch AKS Config from Key Vault
      run: |
        fetch_secret() {
          az keyvault secret show \
            --vault-name ${{ vars.KEYVAULT_NAME }} \
            --name "$1" \
            --query value -o tsv
        }

        echo "RESOURCE_GROUP_NAME=$(fetch_secret rg-name)" >> $GITHUB_ENV
        echo "AKS_CLUSTER_NAME=$(fetch_secret aks-name)" >> $GITHUB_ENV

    - name: Update Chart appVersion
      if: ${{ inputs.app_version != '' }}
      run: |
        sed -i "s/^appVersion: .*$/appVersion: \"${{ inputs.app_version }}\"/" ./helm/Chart.yaml

    - name: Authenticate to AKS
      run: |
        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP_NAME" \
          --name "$AKS_CLUSTER_NAME" \
          --overwrite-existing

    - name: Deploy to AKS using Helm
      run: |
        helm upgrade --install $RELEASE_NAME ./helm \
          --namespace $K8S_NAMESPACE \
          --values ./helm/values.yaml \
          --values "$VALUES_FILE" \
          --set image="$IMAGE_TAG"
